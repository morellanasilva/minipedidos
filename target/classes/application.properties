# Nombre de la aplicación
spring.application.name=minipedidos

# Puerto web de Spring Boot
server.port=8080

# Conexión con RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Reintentos del consumidor RabbitMQ
spring.rabbitmq.listener.simple.retry.enabled=true

# Dos intentos en total: uno inicial y un reintento
spring.rabbitmq.listener.simple.retry.max-attempts=2

# Esperar un segundo antes del reintento
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms

# Mantener fija la espera entre intentos
spring.rabbitmq.listener.simple.retry.multiplier=1.0

# Si se agotan los intentos, rechazar sin reencolar
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ==========================================
# APACHE KAFKA - MINIPEDIDOS
# ==========================================

# Dirección del broker Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Serialización del productor
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Deserialización del consumidor
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Grupo de consumidores
spring.kafka.consumer.group-id=minipedidos-group

# Lectura inicial si no existen offsets guardados
spring.kafka.consumer.auto-offset-reset=earliest
